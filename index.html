<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MDAPL — Live Task Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root{
    --bg:#0b1020; --bg2:#121a33; --card:#161f3d; --card2:#1c2950;
    --line:#27345e; --txt:#e8edf9; --mut:#93a0c4; --acc:#6c8cff; --acc2:#22d3ee;
    --red:#ff5d6c; --redbg:#3a1620; --amber:#ffb13d; --amberbg:#3a2a12; --green:#3ddc97; --greenbg:#10301f;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',system-ui,-apple-system,Roboto,sans-serif;background:
    radial-gradient(1200px 600px at 80% -10%, #1b2a55 0%, transparent 60%),
    radial-gradient(1000px 500px at -10% 10%, #16284d 0%, transparent 55%), var(--bg);
    color:var(--txt);min-height:100vh;padding:22px;}
  .wrap{max-width:1500px;margin:0 auto}
  header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px;margin-bottom:20px}
  .brand{display:flex;align-items:center;gap:14px}
  .logo{width:52px;height:52px;border-radius:12px;background:#ffffff;
    display:flex;align-items:center;justify-content:center;box-shadow:0 6px 20px rgba(0,0,0,.35);padding:6px}
  .logo svg{width:100%;height:100%}
  .logo img{width:100%;height:100%;object-fit:contain}
  h1{font-size:22px;letter-spacing:.3px}
  .sub{color:var(--mut);font-size:12.5px;margin-top:2px}
  .live{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--mut);background:var(--card);
    border:1px solid var(--line);padding:8px 14px;border-radius:30px}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 0 0 rgba(61,220,151,.6);animation:p 2s infinite}
  .dot.snap{background:var(--amber)}
  @keyframes p{0%{box-shadow:0 0 0 0 rgba(61,220,151,.6)}70%{box-shadow:0 0 0 9px rgba(61,220,151,0)}100%{box-shadow:0 0 0 0 rgba(61,220,151,0)}}

  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
  .kpi{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);
    border-radius:16px;padding:18px 20px;position:relative;overflow:hidden;cursor:pointer;transition:.18s}
  .kpi:hover{transform:translateY(-3px);border-color:var(--acc)}
  .kpi.active{outline:2px solid var(--acc);outline-offset:-2px}
  .kpi .n{font-size:38px;font-weight:800;line-height:1}
  .kpi .l{color:var(--mut);font-size:12.5px;margin-top:8px;text-transform:uppercase;letter-spacing:.6px}
  .kpi .bar{position:absolute;left:0;top:0;bottom:0;width:6px}
  .kpi.total .bar{background:linear-gradient(var(--acc),var(--acc2))}
  .kpi.over .bar{background:var(--red)} .kpi.over .n{color:var(--red)}
  .kpi.week .bar{background:var(--amber)} .kpi.week .n{color:var(--amber)}
  .kpi.up .bar{background:var(--green)} .kpi.up .n{color:var(--green)}

  .panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
  .charts{display:grid;grid-template-columns:1.1fr 1.6fr 1.6fr;gap:14px;margin-bottom:18px}
  .charts h3{font-size:13px;color:var(--mut);margin-bottom:10px;text-transform:uppercase;letter-spacing:.6px;font-weight:600}
  .cwrap{position:relative;height:115px}
  .cscroll{position:relative;height:150px;overflow-y:auto;overflow-x:hidden}
  .cscroll::-webkit-scrollbar{width:7px}.cscroll::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
  .cinner{position:relative;min-height:150px}

  .filters{display:grid;grid-template-columns:repeat(4,1fr) 1.4fr auto;gap:12px;align-items:end;margin-bottom:16px}
  .filters .f label{display:block;font-size:11.5px;color:var(--mut);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
  select,input[type=text]{width:100%;background:var(--bg2);color:var(--txt);border:1px solid var(--line);
    border-radius:10px;padding:11px 12px;font-size:13.5px;outline:none}
  select:focus,input:focus{border-color:var(--acc)}
  .reset{background:var(--card2);color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:11px 16px;
    cursor:pointer;font-size:13px;white-space:nowrap;transition:.15s;height:42px}
  .reset:hover{border-color:var(--red);color:var(--red)}

  .tablecard{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
  .tablehead{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
  .tablehead .cnt{color:var(--mut);font-size:13px}
  .tablehead .cnt b{color:var(--txt)}
  .scroll{overflow:auto;max-height:78vh}
  table{width:100%;border-collapse:collapse;font-size:13px}
  thead th{position:sticky;top:0;background:var(--bg2);color:var(--mut);text-align:left;padding:12px 14px;
    font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;cursor:pointer;white-space:nowrap;border-bottom:1px solid var(--line)}
  thead th:hover{color:var(--txt)}
  thead th .ar{opacity:.4;font-size:10px}
  tbody td{padding:11px 14px;border-bottom:1px solid rgba(39,52,94,.5);vertical-align:top}
  tbody tr:hover{background:rgba(108,140,255,.06)}
  .badge{display:inline-block;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap}
  .b-over{background:var(--redbg);color:var(--red);border:1px solid rgba(255,93,108,.35)}
  .b-week{background:var(--amberbg);color:var(--amber);border:1px solid rgba(255,177,61,.35)}
  .b-up{background:var(--greenbg);color:var(--green);border:1px solid rgba(61,220,151,.35)}
  .gp{font-weight:700;font-variant-numeric:tabular-nums}
  .gp.neg{color:var(--red)} .gp.small{color:var(--amber)} .gp.ok{color:var(--green)}
  .tno{font-weight:700;color:var(--acc2);font-variant-numeric:tabular-nums;white-space:nowrap}
  .proj{font-weight:600;color:#cdd8ff}
  .who{color:var(--acc2)}
  .tk{max-width:340px;color:var(--txt)}
  .meta{color:var(--mut);font-size:11.5px;margin-top:3px}
  a.vid{color:var(--acc);text-decoration:none;font-size:11.5px}
  a.vid:hover{text-decoration:underline}
  .pill{display:inline-block;background:var(--bg2);border:1px solid var(--line);color:var(--mut);font-size:10.5px;padding:2px 7px;border-radius:6px}
  .empty{padding:50px;text-align:center;color:var(--mut)}
  footer{margin-top:18px;text-align:center;color:var(--mut);font-size:12px}
  @media(max-width:1100px){.charts{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,1fr)}.filters{grid-template-columns:1fr 1fr}}
  @media(max-width:600px){.kpis{grid-template-columns:1fr 1fr}.filters{grid-template-columns:1fr}}
</style>
</head>

let DATA=[], VIEW=[], sortKey='dt', sortDir=1;
const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

function parseDate(s){
  if(!s) return null;
  s=String(s).trim();
  let m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/); if(m) return new Date(+m[1],+m[2]-1,+m[3]);
  m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/); if(m) return new Date(+m[3],+m[1]-1,+m[2]);
  m=s.match(/^(\d{1,2})-([A-Za-z]{3})-(\d{4})/); if(m){const mi=MONTHS.findIndex(x=>x.toLowerCase()==m[2].toLowerCase());return new Date(+m[3],mi,+m[1]);}
  const d=new Date(s); return isNaN(d)?null:d;
}
function fmtDate(s){const d=parseDate(s); if(!d) return s||'—'; return String(d.getDate()).padStart(2,'0')+'-'+MONTHS[d.getMonth()]+'-'+d.getFullYear();}

function parseCSV(t){
  const rows=[];let row=[],cur='',q=false;
  for(let i=0;i<t.length;i++){const c=t[i];
    if(q){ if(c=='"'){ if(t[i+1]=='"'){cur+='"';i++;} else q=false;} else cur+=c; }
    else { if(c=='"')q=true; else if(c==','){row.push(cur);cur='';} else if(c=='\n'){row.push(cur);rows.push(row);row=[];cur='';} else if(c=='\r'){} else cur+=c; }
  }
  if(cur!==''||row.length){row.push(cur);rows.push(row);}
  return rows;
}
function fromCSV(t){
  const g=parseCSV(t); const out=[];
  for(let i=1;i<g.length;i++){const r=g[i]; if(!r) continue;
    const pr=(r[13]||'').trim(); if(!pr) continue;
    out.push({pr:pr, mh:(r[14]||'').trim(), sh:(r[15]||'').trim(), tk:(r[16]||'').trim(),
      ps:(r[17]||'').trim(), sp:(r[18]||'').trim(), wh:(r[19]||'').trim(), rf:(r[20]||'').trim(),
      dt:(r[21]||'').trim(), gp:(r[22]||'').trim(), st:(r[23]||'').trim(), no:(r[24]||'').trim()});
  }
  return out.filter(x=>['Overdue','Due This Week','Upcoming'].includes(x.st));
}

function uniq(arr){return [...new Set(arr)].filter(Boolean).sort();}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function fillSelect(el,vals,label){el.innerHTML='<option value="ALL">All '+label+'</option>'+vals.map(v=>`<option value="${esc(v).replace(/"/g,'&quot;')}">${esc(v)}</option>`).join('');}

function setup(){
  fillSelect(fProj, uniq(DATA.map(d=>d.pr)),'Projects');
  fillSelect(fPerson, uniq(DATA.map(d=>d.wh)),'People');
  fillSelect(fCat, uniq(DATA.map(d=>d.mh)),'Categories');
  fStatus.innerHTML='<option value="ALL">All Statuses</option><option>Overdue</option><option>Due This Week</option><option>Upcoming</option>';
  thRow.innerHTML=COLS.map(c=>`<th data-k="${c.k}">${c.t} <span class="ar">&#8597;</span></th>`).join('');
  thRow.querySelectorAll('th').forEach(th=>th.onclick=()=>{const k=th.dataset.k; if(sortKey==k)sortDir*=-1; else{sortKey=k;sortDir=1;} render();});
  [fProj,fPerson,fCat,fStatus].forEach(s=>s.onchange=render);
  fSearch.oninput=render;
  reset.onclick=()=>{fProj.value='ALL';fPerson.value='ALL';fCat.value='ALL';fStatus.value='ALL';fSearch.value='';setKpiActive('ALL');render();};
  document.querySelectorAll('.kpi').forEach(k=>k.onclick=()=>{fStatus.value=k.dataset.st;setKpiActive(k.dataset.st);render();});
  totalRows.textContent=DATA.length;
}
function setKpiActive(st){document.querySelectorAll('.kpi').forEach(k=>k.classList.toggle('active',k.dataset.st==st));}

function applyFilters(includeStatus){
  const p=fProj.value,pe=fPerson.value,c=fCat.value,s=fStatus.value,q=fSearch.value.trim().toLowerCase();
  return DATA.filter(d=>{
    if(p!='ALL'&&d.pr!=p)return false;
    if(pe!='ALL'&&d.wh!=pe)return false;
    if(c!='ALL'&&d.mh!=c)return false;
    if(includeStatus&&s!='ALL'&&d.st!=s)return false;
    if(q){const hay=(d.no+' '+d.tk+' '+d.sp+' '+d.sh+' '+d.ps+' '+d.pr+' '+d.wh+' '+d.mh).toLowerCase();if(!hay.includes(q))return false;}
    return true;
  });
}
function gapClass(g){g=parseFloat(g); if(isNaN(g))return ''; if(g<0)return 'neg'; if(g<=5)return 'small'; return 'ok';}
function badge(st){const m={'Overdue':'b-over','Due This Week':'b-week','Upcoming':'b-up'};return `<span class="badge ${m[st]||''}">${st}</span>`;}

function render(){
  VIEW=applyFilters(true);
  VIEW.sort((a,b)=>{
    let x=a[sortKey],y=b[sortKey];
    if(sortKey=='dt'){x=parseDate(x)||0;y=parseDate(y)||0;}
    else if(sortKey=='gp'||sortKey=='no'){x=parseFloat(x)||0;y=parseFloat(y)||0;}
    else {x=(x||'').toLowerCase();y=(y||'').toLowerCase();}
    return x<y?-sortDir:x>y?sortDir:0;
  });
  const tb=document.getElementById('tbody');
  if(!VIEW.length){tb.innerHTML=`<tr><td colspan="${COLS.length}"><div class="empty">No tasks match these filters.</div></td></tr>`;}
  else tb.innerHTML=VIEW.map(d=>{
    const g=d.gp!==''?(parseFloat(d.gp)>0?'+':'')+parseInt(d.gp):'';
    const vid=/^https?:/.test(d.rf)?`<a class="vid" href="${esc(d.rf)}" target="_blank" rel="noopener">&#9654; video/link</a>`:(d.rf?`<span class="pill">${esc(d.rf)}</span>`:'');
    return `<tr>
      <td class="tno">${esc(d.no)||'—'}</td>
      <td class="proj">${esc(d.pr)}</td>
      <td class="who">${esc(d.wh)||'—'}</td>
      <td>${esc(d.mh)||'—'}${d.sh?`<div class="meta">${esc(d.sh)}</div>`:''}</td>
      <td class="tk">${esc(d.tk)||'—'}${d.ps?`<div class="meta">&#10549; ${esc(d.ps)}</div>`:''}${vid?`<div>${vid}</div>`:''}</td>
      <td>${esc(d.sp)||'—'}</td>
      <td>${fmtDate(d.dt)}</td>
      <td class="gp ${gapClass(d.gp)}">${g}</td>
      <td>${badge(d.st)}</td>
    </tr>`;}).join('');
  document.getElementById('shown').textContent=VIEW.length;
  thRow.querySelectorAll('th').forEach(th=>{const a=th.querySelector('.ar');a.innerHTML=th.dataset.k==sortKey?(sortDir>0?'&#8593;':'&#8595;'):'&#8597;';});
  document.getElementById('sortNote').textContent='Sorted by '+(COLS.find(c=>c.k==sortKey)||{t:''}).t+' '+(sortDir>0?'↑':'↓');
  updateKpis(); updateCharts();
}

function updateKpis(){
  const base=applyFilters(false);
  document.getElementById('kTotal').textContent=base.length;
  document.getElementById('kOver').textContent=base.filter(d=>d.st=='Overdue').length;
  document.getElementById('kWeek').textContent=base.filter(d=>d.st=='Due This Week').length;
  document.getElementById('kUp').textContent=base.filter(d=>d.st=='Upcoming').length;
}

let chStatus,chPerson,chProj;
const C={over:'#ff5d6c',week:'#ffb13d',up:'#3ddc97',acc:'#6c8cff',acc2:'#22d3ee',grid:'#27345e',txt:'#93a0c4'};
Chart.defaults.color=C.txt; Chart.defaults.font.family="'Segoe UI',system-ui,sans-serif";
function topCounts(arr,key,n){const m={};arr.forEach(d=>{const k=d[key]||'—';m[k]=(m[k]||0)+1;});
  return Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,n);}
function shortName(s){s=s||'';return s.length>30?s.slice(0,29)+'…':s;}

function updateCharts(){
  const src=VIEW.length?VIEW:DATA;
  const st={Overdue:src.filter(d=>d.st=='Overdue').length,'Due This Week':src.filter(d=>d.st=='Due This Week').length,Upcoming:src.filter(d=>d.st=='Upcoming').length};
  const per=topCounts(src,'wh',999), pr=topCounts(src,'pr',999);
  document.getElementById('cPersonWrap').style.height=Math.max(150, per.length*26+24)+'px';
  document.getElementById('cProjWrap').style.height=Math.max(150, pr.length*26+24)+'px';
  if(!chStatus){
    chStatus=new Chart(cStatus,{type:'doughnut',data:{labels:Object.keys(st),datasets:[{data:Object.values(st),backgroundColor:[C.over,C.week,C.up],borderColor:'#161f3d',borderWidth:3}]},options:{plugins:{legend:{position:'bottom',labels:{boxWidth:12,padding:14}}},cutout:'62%',responsive:true,maintainAspectRatio:false}});
    chPerson=new Chart(cPerson,{type:'bar',data:{labels:[],datasets:[{data:[],backgroundColor:C.acc,borderRadius:6}]},options:barOpt()});
    chProj=new Chart(cProj,{type:'bar',data:{labels:[],datasets:[{data:[],backgroundColor:C.acc2,borderRadius:6}]},options:barOpt()});
  } else {
    chStatus.data.datasets[0].data=Object.values(st);chStatus.update();
  }
  const perR=per.slice().reverse();
  chPerson.data.labels=perR.map(x=>shortName(x[0]));chPerson.data.datasets[0].data=perR.map(x=>x[1]);chPerson.update();
  chProj.data.labels=pr.map(x=>shortName(x[0]));chProj.data.datasets[0].data=pr.map(x=>x[1]);chProj.update();
}
function barOpt(){return {indexAxis:'y',plugins:{legend:{display:false}},responsive:true,maintainAspectRatio:false,
  scales:{x:{grid:{color:C.grid},ticks:{precision:0}},y:{grid:{display:false},ticks:{font:{size:11}}}}};}

async function boot(){
  let loaded=false;
  if(LIVE_CSV_URL && LIVE_CSV_URL.indexOf('http')===0){
    try{
      const res=await fetch(LIVE_CSV_URL,{cache:'no-store'});
      if(res.ok){const txt=await res.text(); const recs=fromCSV(txt);
        if(recs.length){DATA=recs;loaded=true;
          document.getElementById('dot').classList.remove('snap');
          document.getElementById('liveTxt').textContent='Live · updated '+new Date().toLocaleString('en-IN',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
        }
      }
    }catch(e){console.warn('live fetch failed',e);}
  }
  if(!loaded){DATA=SNAPSHOT;
    document.getElementById('dot').classList.add('snap');
    document.getElementById('liveTxt').textContent='Snapshot · '+SNAPSHOT_DATE;
  }
  setup(); render();
}
boot();
</script>
</body>
</html>
